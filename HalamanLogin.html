<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Cafe Engineering Polije</title>
   
</head>
<body class="login-body">
    <div class="login-container">
        <!-- SEKSI KIRI: BANNER HERO -->
        <div class="login-left">
            <div class="login-left-brand">
                <span>☕</span> E-Cafe
            </div>
            <div class="login-left-quote">
                <h1>Setiap cangkir,<br>layanan yang lebih baik.</h1>
                <p>Sistem Informasi Akademik & POS Kasir E-Cafe Jurusan Teknik Polije.</p>
            </div>
            <div style="font-size: 0.8rem; color: #D9D2C9;">
                &copy; 2026 Jurusan Teknik - Politeknik Negeri Jember
            </div>
        </div>

        <!-- SEKSI KANAN: FORM LOGIN -->
        <div class="login-right">
            <div class="login-box">
                <h2>Mulai hari yang baik</h2>
                <p class="subtitle">Masuk untuk mengelola pesanan atau layanan akademik.</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="nimInput">NIM / ID Karyawan</label>
                        <input type="text" id="nimInput" placeholder="Masukkan NIM (Contoh: E41210001)" required>
                    </div>

                    <div class="form-group">
                        <label for="passwordInput">Kata Sandi</label>
                        <input type="password" id="passwordInput" placeholder="12345678" required>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 1rem;">Masuk ke Akun</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
